[package]
name = "hyperx-mouse-battery-daemon"
version = "0.1.0"
edition = "2021"
description = "Polls HyperX Pulsefire 2 wireless battery via hidraw; writes JSON for the Omarchy bar widget"

[dependencies]
nix = { version = "0.29", features = ["poll", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
